; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:freenove_esp32_s3_wroom]
platform = espressif32
board = freenove_esp32_s3_wroom
framework = arduino

; Configuration Flash & PSRAM (Standard Freenove ESP32-S3 N8R8 / N16R8)
board_build.arduino.memory_type = qio_opi
board_build.flash_mode = qio
board_build.psram_type = opi
board_upload.flash_size = 8MB
board_upload.maximum_size = 8388608

; Moniteur série et vitesse de téléversement
monitor_port = COM7
monitor_speed = 115200
monitor_echo = yes
; The firmware buffers input and dispatches each command only after LF (Enter).
monitor_eol = LF
upload_port = COM7
upload_speed = 921600

; Moniteur CH343 sur UART0 ; MIDI filaire sur UART1
build_flags =
    -DBOARD_HAS_PSRAM
    -DCORE_DEBUG_LEVEL=1

; Bibliothèques requises
lib_deps =
    sparkfun/SX1509 IO Expander @ ^3.0.6
    fortyseveneffects/MIDI Library @ ^5.0.2

